name: ci
on: [push, pull_request]
permissions:
  contents: read
  id-token: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: google-github-actions/auth@v3
        with:
          project_id: ev-forecast-2026
          workload_identity_provider: projects/781715244884/locations/global/workloadIdentityPools/gh-pool/providers/gh-provider
          service_account: ev-ci-sa@ev-forecast-2026.iam.gserviceaccount.com
      - run: pip install pytest pandas numpy google-cloud-bigquery
      - run: python -m pytest -q tests
        env:
          GCP_PROJECT: ev-forecast-2026
